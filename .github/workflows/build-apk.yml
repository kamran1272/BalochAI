name: Build Baloch APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -sS -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Fetch README visuals (fault-tolerant)
        continue-on-error: true
        run: |
          mkdir -p docs/images
          curl -sL --max-time 120 "https://muse.ai/files/1277978102076545/2687284281691098/cgabyp77p7che6rq6y1j5le4/logo-arc-reactor.webp" -o docs/images/logo-obsidian-cube.webp || true
          curl -sL --max-time 120 "https://muse.ai/files/1277978102076545/1119993763755772/w4y70ybqv9jcobr6fx0d5785/ui-splash.webp" -o docs/images/ui-splash.webp || true
          curl -sL --max-time 120 "https://muse.ai/files/1277978102076545/1648126910385945/c6furu74xjarandpvct5r4z4/ui-main.webp" -o docs/images/ui-main.webp || true
          curl -sL --max-time 120 "https://muse.ai/files/1277978102076545/1648256176836531/eojnpo2lmxq0xycoi7c05w26/ui-settings.webp" -o docs/images/ui-settings.webp || true
          curl -sL --max-time 120 "https://muse.ai/files/1277978102076545/4465091963750995/wb3ox6ejvrra3mv54po0se7c/ui-memory.webp" -o docs/images/ui-memory.webp || true
          curl -sL --max-time 300 "https://muse.ai/files/1277978102076545/1050236558034460/2tlc6e406mlupu9osf31awmw/baloch-showcase.mp4" -o docs/images/baloch-showcase.mp4 || true
          ls -la docs/images/ || true

      - name: Generate launcher icons from logo
        run: |
          pip install -q pillow
          python3 - <<'EOF'
          from PIL import Image, ImageDraw
          import os
          logo = 'docs/images/logo-obsidian-cube.webp'
          if os.path.exists(logo) and os.path.getsize(logo) > 1000:
              im = Image.open(logo).convert('RGBA')
          else:
              im = Image.new('RGBA', (512, 512), (8, 10, 14, 255))
              ImageDraw.Draw(im).ellipse([156, 156, 356, 356], fill=(0, 229, 255, 255))
          os.makedirs('app/src/main/res/drawable', exist_ok=True)
          im.resize((432, 432), Image.LANCZOS).save('app/src/main/res/drawable/ic_launcher_foreground.png')
          for dname, size in [('mipmap-mdpi', 48), ('mipmap-hdpi', 72), ('mipmap-xhdpi', 96),
                              ('mipmap-xxhdpi', 144), ('mipmap-xxxhdpi', 192)]:
              p = 'app/src/main/res/%s' % dname
              os.makedirs(p, exist_ok=True)
              sq = im.resize((size, size), Image.LANCZOS)
              sq.save('%s/ic_launcher.png' % p)
              mask = Image.new('L', (size, size), 0)
              ImageDraw.Draw(mask).ellipse([0, 0, size, size], fill=255)
              rnd = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              rnd.paste(sq, (0, 0), mask)
              rnd.save('%s/ic_launcher_round.png' % p)
          print('launcher icons generated')
          EOF

      - name: Commit visuals + fix README paths (fault-tolerant)
        continue-on-error: true
        run: |
          git config user.name "Baloch Factory"
          git config user.email "factory@baloch.local"
          sed -i 's|https://github.com/kamran1272/BalochAI/releases/download/v1.0.0/|docs/images/|g' README.md || true
          git add docs/images/ README.md
          if ! git diff --cached --quiet; then
            git commit -m "Add README visuals [skip ci]"
            git push origin HEAD:main
            echo "visuals committed"
          else
            echo "visuals already present"
          fi

      - name: Download Gradle 8.9 (direct, no action)
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> $GITHUB_PATH
          gradle --version | head -8

      - name: Build debug APK (log captured)
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace > ci-build.log 2>&1
          echo "GRADLE_EXIT=$?" >> $GITHUB_ENV
          set -e
          echo "--- last 30 lines of build log ---"
          tail -30 ci-build.log

      - name: Commit build log on failure (fault-tolerant)
        if: env.GRADLE_EXIT != '0'
        continue-on-error: true
        run: |
          git config user.name "Baloch Factory"
          git config user.email "factory@baloch.local"
          tail -400 ci-build.log > ci-build-error.log
          git add ci-build-error.log
          git commit -m "CI build error log [skip ci]" || true
          git push origin HEAD:main || true
          echo "error log committed"

      - name: Fail the job if build failed
        if: env.GRADLE_EXIT != '0'
        run: |
          echo "Gradle build failed (exit $GRADLE_EXIT). See ci-build-error.log in the repo."
          exit 1

      - name: Upload APK artifact
        if: env.GRADLE_EXIT == '0'
        uses: actions/upload-artifact@v4
        with:
          name: baloch-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        if: env.GRADLE_EXIT == '0' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Baloch v1.0.0
          body: |
            Baloch v1.0.0 — JARVIS-style on-device AI assistant for Android.
            Package: com.baloch.ai | minSdk 26 | targetSdk 34
            Install the APK below, grant permissions on first run.
            Visuals: official design mock-ups (concept art, not app screenshots).
          files: |
            app/build/outputs/apk/debug/app-debug.apk
