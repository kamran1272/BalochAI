plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.baloch.ai'
    compileSdk 34

    defaultConfig {
        applicationId "com.baloch.ai"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.3'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    // Vosk offline wake-word engine (always-on voice). ~50MB model downloaded on first run.
    // NOTE: Maven coordinates are com.alphacephei (Java package stays org.vosk).
    implementation 'com.alphacephei:vosk-android:0.3.47'
    // Total Memory: Room + encrypted storage
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    implementation 'androidx.security:security-crypto:1.0.0'
    implementation 'net.zetetic:android-database-sqlcipher:4.5.4'
    // Hand-gesture control: MediaPipe Tasks Vision (on-device TFLite)
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'
    // AI brain: MediaPipe LLM Inference (on-device Gemma 2B, model downloaded on first run — NOT bundled)
    implementation 'com.google.mediapipe:tasks-genai:0.10.27'
    // Instant translate: ML Kit on-device translation (EN<->UR, models downloaded once)
    implementation 'com.google.mlkit:translate:17.0.3'
    // Location reminders: geofencing (OS-level, battery-cheap)
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    ksp 'androidx.room:room-compiler:2.6.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
